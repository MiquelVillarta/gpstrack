<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seguimiento en Vivo - Pilotos</title>
  
  <!-- Leaflet CSS (Mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; display: flex; height: 100vh; background: #121212; color: #fff; }
    
    #sidebar {
      width: 320px;
      background: #1e1e1e;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.5);
      z-index: 1000;
    }

    #search {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
    }

    .pilot-card {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      border-left: 4px solid #00e676;
      transition: background 0.2s;
    }

    .pilot-card:hover { background: #333; }
    .pilot-name { font-weight: bold; font-size: 1.1em; }
    .pilot-stats { font-size: 0.85em; color: #bbb; margin-top: 5px; }

    #map { flex: 1; height: 100%; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>🎯 Pilotos en Vivo</h2>
    <input type="text" id="search" placeholder="Buscar piloto..." onkeyup="filterPilots()" />
    <div id="pilots-list"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const SUPABASE_URL = 'https://ghpiqdmhlhfyeginefnf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_0CQFFsTpM2rw7_mMEo0IUw_1NTVEnEE';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const map = L.map('map').setView([40.4167, -3.7037], 6);
  
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    subdomains: 'abc',
    attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)'
  }).addTo(map);

  const markers = {};
  const polylines = {};
  const pilotTracks = {}; // Guarda { [pilot_id]: [ {lat, lng, time}, ... ] }
  const pilotsData = {};

  const FIVE_MINUTES_MS = 5 * 60 * 1000;

  async function loadInitialLocations() {
    // Cargar ubicaciones de los últimos 5 minutos al iniciar la web
    const fiveMinutesAgo = new Date(Date.now() - FIVE_MINUTES_MS).toISOString();
    
    const { data, error } = await supabaseClient
      .from('pilots_locations')
      .select('*')
      .gte('updated_at', fiveMinutesAgo)
      .order('updated_at', { ascending: true });

    if (data) {
      data.forEach(processNewPoint);
    }
  }

  function processNewPoint(point) {
    const { pilot_id, name, latitude, longitude, altitude, speed, updated_at } = point;
    const pointTime = new Date(updated_at).getTime();

    // 1. Guardar o actualizar la información actual del piloto
    pilotsData[pilot_id] = point;

    // 2. Inicializar el array de historial si no existe
    if (!pilotTracks[pilot_id]) {
      pilotTracks[pilot_id] = [];
    }

    // Añadir el nuevo punto
    pilotTracks[pilot_id].push({ lat: latitude, lng: longitude, time: pointTime });

    // 3. Filtrar puntos para mantener SOLO los de los últimos 5 minutos
    const now = Date.now();
    pilotTracks[pilot_id] = pilotTracks[pilot_id].filter(p => (now - p.time) <= FIVE_MINUTES_MS);

    // 4. Dibujar o actualizar la línea (Track)
    const latLngs = pilotTracks[pilot_id].map(p => [p.lat, p.lng]);

    if (polylines[pilot_id]) {
      polylines[pilot_id].setLatLngs(latLngs);
    } else {
      polylines[pilot_id] = L.polyline(latLngs, {
        color: '#ff3300', // Color rojo para destacar la trayectoria
        weight: 4,
        opacity: 0.8,
        smoothFactor: 1
      }).addTo(map);
    }

    // 5. Dibujar o actualizar el marcador actual
    const displayName = name || pilot_id;
    const speedFixed = speed ? speed.toFixed(1) : "0.0";
    const altFixed = altitude ? altitude.toFixed(0) : "0";

    if (markers[pilot_id]) {
      markers[pilot_id].setLatLng([latitude, longitude]);
    } else {
      markers[pilot_id] = L.marker([latitude, longitude]).addTo(map);
      map.setView([latitude, longitude], 14);
    }

    markers[pilot_id].bindPopup(`
      <b style="font-size: 1.1em">${displayName}</b><br>
      Velocidad: <b>${speedFixed} km/h</b><br>
      Altitud: <b>${altFixed} m</b>
    `);

    renderPilotsList();
  }

  function renderPilotsList() {
    const listContainer = document.getElementById('pilots-list');
    const filterText = document.getElementById('search').value.toLowerCase();
    listContainer.innerHTML = '';

    Object.values(pilotsData).forEach(pilot => {
      const displayName = pilot.name || pilot.pilot_id;

      if (displayName.toLowerCase().includes(filterText) || pilot.pilot_id.toLowerCase().includes(filterText)) {
        const card = document.createElement('div');
        card.className = 'pilot-card';
        card.onclick = () => {
          map.flyTo([pilot.latitude, pilot.longitude], 16);
          markers[pilot.pilot_id].openPopup();
        };

        card.innerHTML = `
          <div class="pilot-name">${displayName}</div>
          <div class="pilot-stats">
            ⚡ ${pilot.speed ? pilot.speed.toFixed(1) : 0} km/h | 🏔️ ${pilot.altitude ? pilot.altitude.toFixed(0) : 0} m
          </div>
        `;
        listContainer.appendChild(card);
      }
    });
  }

  function filterPilots() {
    renderPilotsList();
  }

  // Limpieza periódica cada 30 segundos para borrar líneas antiguas de pilotos detenidos
  setInterval(() => {
    const now = Date.now();
    Object.keys(pilotTracks).forEach(pilot_id => {
      pilotTracks[pilot_id] = pilotTracks[pilot_id].filter(p => (now - p.time) <= FIVE_MINUTES_MS);
      if (polylines[pilot_id]) {
        polylines[pilot_id].setLatLngs(pilotTracks[pilot_id].map(p => [p.lat, p.lng]));
      }
    });
  }, 30000);
  supabaseClient
    .channel('schema-db-changes')
    .on(
      'postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'pilots_locations' },
      (payload) => {
        processNewPoint(payload.new);
      }
    )
    .subscribe();
  loadInitialLocations();
</script>

</body>
</html>
