<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento en Vivo - Pilotos</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* BOTÓN FLOTANTE PARA ABRIR PANEL (Despejado de Zoom) */
    #show-sidebar-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1100;
      background-color: #1e1e24;
      color: #fff;
      border: 1px solid #3a3a4c;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.4);
      display: block; /* Visible por defecto */
    }

    /* PANEL LATERAL DE PILOTOS (Colapsado por defecto) */
    #sidebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 100%;
      background: #18181c;
      color: #fff;
      z-index: 1200;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      transform: translateX(-100%); /* Oculto inicialmente */
    }

    /* Estado visible del sidebar */
    #sidebar.active {
      transform: translateX(0);
    }

    .sidebar-header {
      padding: 15px;
      background: #23232a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    /* CONTENEDOR DEL BUSCADOR */
    .search-container {
      padding: 10px 15px;
      background: #1e1e24;
      border-bottom: 1px solid #2a2a35;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      background: #121215;
      border: 1px solid #3a3a4c;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: #4da6ff;
    }

    .pilot-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .pilot-item {
      padding: 12px 15px;
      border-bottom: 1px solid #2a2a35;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pilot-item:hover, .pilot-item.selected {
      background: #2a2a38;
    }

    .pilot-name {
      font-weight: bold;
      color: #4da6ff;
    }

    .pilot-stats {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }

    .no-results {
      padding: 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Botón flotante para abrir menú -->
  <button id="show-sidebar-btn" onclick="toggleSidebar()">▶ Pilotos</button>

  <!-- Sidebar Lateral -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h3>Participantes</h3>
      <button class="close-btn" onclick="toggleSidebar()">◀</button>
    </div>

    <!-- BUSCADOR DE PILOTOS -->
    <div class="search-container">
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Buscar piloto por ID o nombre..." 
        oninput="renderPilotList()"
      />
    </div>

    <ul id="pilot-list" class="pilot-list">
      <!-- Se puebla dinámicamente -->
    </ul>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. CONFIGURACIÓN SUPABASE
    const SUPABASE_URL = 'https://ghpiqdmhlhfyeginefnf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_0CQFFsTpM2rw7_mMEo0IUw_1NTVEnEE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. CAPAS DE MAPA
    const openStreetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    });

    const openTopoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: '© OpenTopoMap'
    });

    // 3. INICIALIZACIÓN DEL MAPA (Zoom a la derecha)
    const map = L.map('map', {
      center: [41.8204, 1.8326],
      zoom: 9,
      zoomControl: false, 
      layers: [openStreetMap]
    });

    // Reubicar botones de Zoom a la derecha junto al selector
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Selector de Capas
    const baseMaps = {
      "Mapa": openStreetMap,
      "Relieve": openTopoMap
    };
    L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

    // 4. ESTADO DE LA APLICACIÓN
    const pilotsData = {};      // Últimas posiciones
    const pilotTracks = {};     // Historial de coordenadas individual { "p1": [[lat,lng], ...], ... }
    const markers = {};         // Marcadores en el mapa
    let selectedPilotId = null; // Piloto enfocado
    let activeTrackLine = null; // Línea del track actualmente visible

    // 5. GESTIÓN DEL SIDEBAR
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const btn = document.getElementById('show-sidebar-btn');
      
      sidebar.classList.toggle('active');
      if (sidebar.classList.contains('active')) {
        btn.style.display = 'none';
      } else {
        btn.style.display = 'block';
      }
    }

    // 6. MOSTRAR TRACK DEL PILOTO SELECCIONADO
    function showPilotTrack(pilotId) {
      // Borrar línea anterior del mapa
      if (activeTrackLine) {
        map.removeLayer(activeTrackLine);
        activeTrackLine = null;
      }

      const coords = pilotTracks[pilotId] || [];
      if (coords.length > 0) {
        activeTrackLine = L.polyline(coords, {
          color: '#ff3344',
          weight: 4,
          opacity: 0.85
        }).addTo(map);
      }
    }

    // 7. SELECCIÓN DE PILOTO
    function selectPilot(pilotId) {
      selectedPilotId = pilotId;
      const pilot = pilotsData[pilotId];

      if (pilot) {
        map.flyTo([pilot.latitude, pilot.longitude], 15);
        showPilotTrack(pilotId);
      }

      renderPilotList();
    }

    // 8. RENDERIZAR LISTA CON FILTRO DE BÚSQUEDA
    function renderPilotList() {
      const listEl = document.getElementById('pilot-list');
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      listEl.innerHTML = '';

      // Filtrar claves de pilotos según lo escrito en el buscador
      const filteredKeys = Object.keys(pilotsData).filter(id => {
        return id.toLowerCase().includes(query);
      });

      if (filteredKeys.length === 0) {
        listEl.innerHTML = '<li class="no-results">No se encontraron pilotos</li>';
        return;
      }

      filteredKeys.forEach(id => {
        const p = pilotsData[id];
        const li = document.createElement('li');
        li.className = `pilot-item ${id === selectedPilotId ? 'selected' : ''}`;
        li.onclick = () => selectPilot(id);

        li.innerHTML = `
          <div class="pilot-name">${id}</div>
          <div class="pilot-stats">
            Vel: ${(p.speed || 0).toFixed(1)} km/h | Alt: ${(p.altitude || 0).toFixed(0)} m
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    // 9. PROCESAR Y GUARDAR POSICIONES
    function updatePilotPosition(data) {
      const { pilot_id, latitude, longitude, speed, altitude } = data;
      pilotsData[pilot_id] = data;

      // Guardar coordenada en el historial exclusivo de ese piloto
      if (!pilotTracks[pilot_id]) {
        pilotTracks[pilot_id] = [];
      }
      pilotTracks[pilot_id].push([latitude, longitude]);

      // Actualizar o crear marcador en el mapa
      if (markers[pilot_id]) {
        markers[pilot_id].setLatLng([latitude, longitude]);
      } else {
        const marker = L.marker([latitude, longitude]).addTo(map);
        marker.bindTooltip(pilot_id, { permanent: false });
        marker.on('click', () => selectPilot(pilot_id));
        markers[pilot_id] = marker;
      }

      // Si este piloto es el activo, actualizar su línea en vivo
      if (selectedPilotId === pilot_id) {
        showPilotTrack(pilot_id);
      }

      renderPilotList();
    }

    // 10. CARGA INICIAL Y SUSCRIPCIÓN EN TIEMPO REAL
    async function initTracking() {
      // Cargar historial registrado al inicio
      const { data } = await supabaseClient
        .from('pilots_locations')
        .select('*')
        .order('updated_at', { ascending: true });

      if (data) {
        data.forEach(p => updatePilotPosition(p));
      }

      // Escuchar posiciones en vivo de Supabase
      supabaseClient
        .channel('live-pilots')
        .on('postgres_changes', 
          { event: '*', schema: 'public', table: 'pilots_locations' }, 
          (payload) => {
            if (payload.new) updatePilotPosition(payload.new);
          }
        )
        .subscribe();
    }

    // Inicializar la App
    initTracking();
  </script>
</body>
</html>
