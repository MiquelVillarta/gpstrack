<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguiment Lliga Catalana - Parapent</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Firebase App y Firestore (Compatibilidad CDN global) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* BARRA LATERAL */
    #sidebar {
      width: 320px;
      height: 100%;
      background-color: #1e1e24;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      transition: margin-left 0.3s ease;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }

    #sidebar.collapsed {
      margin-left: -320px;
    }

    .sidebar-header {
      padding: 15px;
      background-color: #121216;
      border-bottom: 1px solid #2a2a35;
    }

    .sidebar-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sidebar-header h2 {
      font-size: 1.1rem;
      color: #00d2ff;
      margin: 0;
    }

    .btn-hide-panel {
      background-color: #2a2a35;
      color: #fff;
      border: 1px solid #3a3a4c;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      transition: background-color 0.2s;
    }

    .btn-hide-panel:hover {
      background-color: #3a3a4c;
    }

    #show-sidebar-btn {
      display: block;
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1100;
      background-color: #1e1e24;
      color: #fff;
      border: 1px solid #3a3a4c;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.4);
    }

    #show-sidebar-btn:hover {
      background-color: #2a2a35;
    }

    .search-box, .sort-select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #3a3a4c;
      background-color: #2a2a35;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }

    .sort-select {
      cursor: pointer;
    }

    .selection-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
      color: #bbb;
    }

    .selection-controls label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-toggle-all {
      background: none;
      border: none;
      color: #00d2ff;
      cursor: pointer;
      font-size: 12px;
      text-decoration: underline;
    }

    /* LISTA Y SECCIONES */
    #pilots-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: #00d2ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 12px 0 6px 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a35;
    }

    .pilot-card {
      background-color: #2a2a35;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #3a3a4c;
      transition: background-color 0.2s;
    }

    .pilot-card:hover {
      background-color: #343444;
    }

    .pilot-info {
      flex: 1;
      cursor: pointer;
    }

    .pilot-name {
      font-weight: bold;
      font-size: 14px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pilot-stats {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      margin-top: 8px;
    }

    .card-actions select,
    .card-actions button {
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid #3a3a4c;
      border-radius: 5px;
      background: #1e1e24;
      color: #fff;
      font-size: 12px;
    }

    .card-actions select {
      flex: 1;
    }

    .card-actions button {
      cursor: pointer;
      background: #087e96;
    }

    .card-actions button:hover {
      background: #0699b6;
    }

    .pickup-dialog {
      width: min(420px, calc(100vw - 32px));
      margin: auto;
      padding: 20px;
      border: 1px solid #3a3a4c;
      border-radius: 10px;
      background: #1e1e24;
      color: #fff;
    }

    .pickup-dialog::backdrop {
      background: rgba(0, 0, 0, 0.65);
    }

    .pickup-dialog h2 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .pickup-dialog label {
      display: block;
      margin-bottom: 6px;
      color: #ddd;
    }

    .pickup-dialog select {
      width: 100%;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 5px;
      background: #2a2a35;
      color: #fff;
      font-size: 15px;
    }

    .pickup-dialog textarea {
      width: 100%;
      min-height: 90px;
      margin-top: 6px;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 5px;
      background: #2a2a35;
      color: #fff;
      font: inherit;
      resize: vertical;
    }

    .pickup-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .pickup-dialog-actions button {
      padding: 9px 12px;
      border: 0;
      border-radius: 5px;
      color: #fff;
      background: #087e96;
      cursor: pointer;
    }

    .pickup-dialog-actions button[type="button"] {
      background: #555;
    }

    .assigned-board {
      position: fixed;
      inset: 16px 16px 16px auto;
      z-index: 1200;
      display: none;
      width: min(560px, calc(100vw - 32px));
      overflow-y: auto;
      padding: 18px;
      border: 1px solid #3a3a4c;
      border-radius: 10px;
      background: #1e1e24;
      color: #fff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
    }

    .assigned-board.open {
      display: block;
    }

    .assigned-board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .assigned-board-header h2 {
      color: #00d2ff;
      font-size: 20px;
    }

    .assigned-board-close {
      padding: 7px 10px;
      border: 1px solid #3a3a4c;
      border-radius: 5px;
      background: #2a2a35;
      color: #fff;
      cursor: pointer;
    }

    .assigned-board-toggle {
      position: fixed;
      right: 16px;
      bottom: 18px;
      z-index: 1150;
      min-width: 270px;
      padding: 16px 20px;
      border: 2px solid #b9f6ca;
      border-radius: 10px;
      background: #188038;
      color: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .assigned-board-toggle:hover {
      background: #116b2d;
    }

    .assigned-board-toggle-count {
      display: inline-flex;
      min-width: 26px;
      height: 26px;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      border-radius: 50%;
      background: #fff;
      color: #145c2b;
    }

    .assigned-board-notice {
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid #71c98b;
      border-radius: 8px;
      background: #183b25;
      color: #d8ffe2;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
    }

    .assigned-board-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 16px;
      padding: 10px;
      border-radius: 6px;
      background: #15151b;
      color: #ddd;
      font-size: 12px;
    }

    .assigned-board-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .assigned-board-legend i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .legend-pending {
      background: #9a6500;
    }

    .legend-picked-up {
      background: #27823a;
    }

    .assigned-vehicle-group {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #3a3a4c;
      border-radius: 8px;
      background: #252530;
    }

    .assigned-vehicle-group h3 {
      margin-bottom: 10px;
      color: #fff;
      font-size: 16px;
    }

    .assigned-vehicle-capacity {
      margin: 0 0 10px;
      padding: 9px 10px;
      border: 1px solid #27823a;
      border-radius: 6px;
      background: #183b25;
      color: #d8ffe2;
      font-size: 13px;
      font-weight: bold;
    }

    .assigned-vehicle-capacity.full {
      border-color: #f56c6c;
      background: #4a2020;
      color: #ffdede;
    }

    .assigned-vehicle-capacity.unknown {
      border-color: #7c7c88;
      background: #30303a;
      color: #ddd;
    }

    .assigned-pilot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid #3a3a4c;
    }

    .assigned-pilot-name {
      color: #fff;
      font-weight: bold;
    }

    .assigned-pilot-location {
      margin-top: 4px;
      color: #bbb;
      font-size: 12px;
    }

    .assigned-pilot-state {
      flex-shrink: 0;
      padding: 5px 8px;
      border-radius: 5px;
      background: #9a6500;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
    }

    .assigned-pilot-state.picked-up {
      background: #27823a;
    }

    .assigned-board-empty {
      padding: 18px;
      color: #ccc;
      text-align: center;
    }

    /* BADGES DE ESTADO */
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-pendent { background-color: #e6a23c; color: #fff; }
    .status-aterrat_ok { background-color: #67c23a; color: #fff; }
    .status-recollida { background-color: #e65100; color: #fff; }
    .status-no_recollida { background-color: #409eff; color: #fff; }
    .status-sos { background-color: #f56c6c; color: #fff; animation: blink 1s infinite; }

    @keyframes blink {
      50% { opacity: 0.5; }
    }

    /* MAPA */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background-color: #262626; /* Color de fondo mientras cargan los tiles */
    }

    /* ESTILOS DE MARCADORES */
    .custom-pilot-marker {
      display: flex;
      align-items: center;
    }

    .vehicle-emoji-icon {
      font-size: 34px;
      filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
      line-height: 1;
    }

    .pilot-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      border: 2px solid #ffffff;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .pilot-label {
      background-color: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

<div id="app-container">
  <button id="show-sidebar-btn" onclick="toggleSidebar()">▶ Mostrar</button>
  <button
    id="assigned-board-toggle"
    class="assigned-board-toggle"
    type="button"
    onclick="toggleAssignedBoard()"
  >
    🚐 PILOTOS A RECOGER
    <span id="assigned-board-toggle-count" class="assigned-board-toggle-count">0</span>
  </button>

  <div id="sidebar" class="collapsed">
    <div class="sidebar-header">
      <div class="sidebar-header-top">
        <h2>Seguiment en Viu</h2>
        <button class="btn-hide-panel" onclick="toggleSidebar()">◀ Ocultar</button>
      </div>

      <input type="text" id="search" class="search-box" placeholder="Buscar piloto o vehículo..." oninput="filterPilots()">

      <!-- SELECTOR DE ORDENACIÓN -->
      <select id="sort-select" class="sort-select" onchange="filterPilots()">
        <option value="STATUS">📊 Ordenar per Estat (Alertes primer)</option>
        <option value="NAME">🔤 Ordenar per Nom (A-Z)</option>
        <option value="SPEED">⚡ Ordenar per Velocitat (Més ràpid)</option>
      </select>

      <div class="selection-controls">
        <label>
          <input type="checkbox" id="select-all-checkbox" checked onchange="toggleSelectAll(this.checked)">
          <span>Mostrar tots</span>
        </label>
        <button class="btn-toggle-all" onclick="toggleSelectAllAction()">Invertir selecció</button>
      </div>
    </div>

    <div id="pilots-list"></div>
  </div>

  <section id="assigned-board" class="assigned-board" aria-label="Pilotos asignados">
    <div class="assigned-board-header">
      <h2>Recogidas por transporte</h2>
      <button
        class="assigned-board-close"
        type="button"
        onclick="toggleAssignedBoard(false)"
      >Cerrar</button>
    </div>
    <div class="assigned-board-legend" aria-label="Leyenda de estados">
      <span><i class="legend-pending"></i>Pendiente de recogida</span>
      <span><i class="legend-picked-up"></i>Recogido</span>
    </div>
    <div id="assigned-board-content" aria-live="polite"></div>
  </section>

  <div id="map"></div>
</div>

<script>
  // Inicialización de Firebase
  const firebaseConfig = {
    projectId: "gpstrack-8c73b"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Capas del mapa
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  });

  const openTopoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    subdomains: 'abc',
    attribution: 'Map data: © OpenStreetMap, SRTM | Style: © OpenTopoMap'
  });

  const esriSatelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri'
  });

  // Mapa inicializado con OpenStreetMap como capa por defecto
  const map = L.map('map', {
    center: [41.8204, 1.8326],
    zoom: 9,
    layers: [osmLayer],
    zoomControl: false
  });

  L.control.zoom({ position: 'topright' }).addTo(map);

  const baseMaps = {
    "OpenStreetMap": osmLayer,
    "OpenTopoMap": openTopoLayer,
    "Esri Satèl·lit": esriSatelliteLayer
  };

  L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

  // Asegurar renderizado correcto del contenedor del mapa
  setTimeout(() => { map.invalidateSize(); }, 200);

  const markers = {};
  const polylines = {};
  const pilotTracks = {};
  const pilotsData = {};
  const visiblePilots = {};
  const animatingMarkers = {};
  let initialBoundsFitDone = false;
  let assignedBoardOpen = false;
  let receivedInitialAssignments = false;
  let previousPendingAssignmentIds = new Set();

  const FIVE_MINUTES_MS = 5 * 60 * 1000;

  const STATUS_PRIORITY = {
    'SOS': 1,
    'RECOLLIDA': 2,
    'PENDENT': 3,
    'ATERRAT_OK': 4,
    'NO_RECOLLIDA': 5
  };

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const showBtn = document.getElementById('show-sidebar-btn');

    sidebar.classList.toggle('collapsed');

    if (sidebar.classList.contains('collapsed')) {
      showBtn.style.display = 'block';
    } else {
      showBtn.style.display = 'none';
    }

    setTimeout(() => { map.invalidateSize(); }, 300);
  }

  function toggleAssignedBoard(forceOpen) {
    assignedBoardOpen = forceOpen ?? !assignedBoardOpen;
    document.getElementById('assigned-board').classList.toggle(
      'open',
      assignedBoardOpen
    );
    if (assignedBoardOpen) renderAssignedPickups();
  }

  function renderAssignedPickups() {
    const groups = new Map();
    const pendingAssignmentIds = new Set();

    Object.values(pilotsData).forEach(pilot => {
      if (
        !pilot.assignedDriverId ||
        !['assigned', 'picked_up'].includes(pilot.driverStatus)
      ) {
        return;
      }
      if (pilot.driverStatus === 'assigned') {
        pendingAssignmentIds.add(pilot._documentId || pilot.pilot_id);
      }
      if (!groups.has(pilot.assignedDriverId)) {
        groups.set(pilot.assignedDriverId, []);
      }
      groups.get(pilot.assignedDriverId).push(pilot);
    });

    document.getElementById('assigned-board-toggle-count').textContent =
      String(pendingAssignmentIds.size);

    if (!assignedBoardOpen) return;

    const content = document.getElementById('assigned-board-content');
    content.replaceChildren();

    if (pendingAssignmentIds.size === 0) {
      const notice = document.createElement('p');
      notice.className = 'assigned-board-notice';
      notice.textContent = 'PENDENT DE REBRE INSTRUCCIONS';
      content.appendChild(notice);
    }

    if (groups.size === 0) {
      const empty = document.createElement('p');
      empty.className = 'assigned-board-empty';
      empty.textContent = 'Encara no hi ha cap pilot assignat a un transport.';
      content.appendChild(empty);
      return;
    }

    [...groups.keys()].sort((a, b) => a.localeCompare(b)).forEach(vehicleId => {
      const group = document.createElement('section');
      group.className = 'assigned-vehicle-group';
      const heading = document.createElement('h3');
      heading.textContent = `🚐 ${vehicleId}`;
      group.appendChild(heading);

      const vehicle = pilotsData[vehicleId];
      const capacityValue = Number(vehicle?.capacity);
      const hasCapacity = Number.isInteger(capacityValue) && capacityValue > 0;
      const occupied = groups.get(vehicleId).length;
      const available = hasCapacity
        ? Math.max(0, capacityValue - occupied)
        : null;
      const capacitySummary = document.createElement('p');
      capacitySummary.className = 'assigned-vehicle-capacity';
      if (!hasCapacity) {
        capacitySummary.classList.add('unknown');
        capacitySummary.textContent =
          `Places ocupades: ${occupied} · Capacitat no indicada`;
      } else if (available === 0) {
        capacitySummary.classList.add('full');
        capacitySummary.textContent =
          `TRANSPORT PLE · ${occupied}/${capacityValue} places ocupades`;
      } else {
        capacitySummary.textContent =
          `Places ocupades: ${occupied}/${capacityValue} · ` +
          `Disponibles: ${available}`;
      }
      group.appendChild(capacitySummary);

      groups.get(vehicleId)
        .sort((a, b) => a.pilot_id.localeCompare(b.pilot_id))
        .forEach(pilot => {
          const row = document.createElement('div');
          row.className = 'assigned-pilot-row';
          const details = document.createElement('div');
          const name = document.createElement('div');
          name.className = 'assigned-pilot-name';
          name.textContent = pilot.pilot_id;
          name.tabIndex = 0;
          name.title = 'Centrar en el mapa';
          name.addEventListener('click', () => {
            toggleAssignedBoard(false);
            focusPilot(pilot.pilot_id);
          });
          const location = document.createElement('div');
          location.className = 'assigned-pilot-location';
          location.textContent =
            `Ubicación: ${pilot.latitude ?? '--'}, ${pilot.longitude ?? '--'}`;
          details.append(name, location);
          if (
            typeof pilot.organizationMessage === 'string' &&
            pilot.organizationMessage.trim()
          ) {
            const instruction = document.createElement('div');
            instruction.className = 'assigned-pilot-location';
            instruction.textContent =
              `Instrucciones: ${pilot.organizationMessage.trim()}`;
            details.appendChild(instruction);
          }

          const state = document.createElement('span');
          const pickedUp = pilot.driverStatus === 'picked_up';
          state.className = `assigned-pilot-state${pickedUp ? ' picked-up' : ''}`;
          state.textContent = pickedUp ? 'RECOGIDO' : 'PENDIENTE';
          row.append(details, state);
          group.appendChild(row);
        });
      content.appendChild(group);
    });
  }

  function isVehicle(item) {
    return item?.role === 'transport';
  }

  function createPilotIconHtml(displayName, currentSpeedKmH, status, point) {
    const cleanName = (displayName || 'P').toString().trim();
    if (isVehicle(point)) {
      const capacity = Number(point.capacity) || 0;
      const icon = capacity > 12 ? '🚌' : capacity > 5 ? '🚐' : '🚗';
      return `
        <span class="vehicle-emoji-icon">${icon}</span>
        <span class="pilot-label">${cleanName}</span>
      `;
    }

    const inicial = cleanName.charAt(0).toUpperCase();
    let colorAvatar = currentSpeedKmH >= 10.0 ? '#28a745' : '#3A8EC7';

    if (status === 'SOS') colorAvatar = '#f56c6c';

    return `
      <div class="pilot-avatar" style="background-color:${colorAvatar};">${inicial}</div>
      <span class="pilot-label">${cleanName}</span>
    `;
  }

  function processNewPoint(point, isInitialLoad = false) {
    const { pilot_id, latitude, longitude, altitude, speed, status, updated_at } = point;
    const pointTime = updated_at ? new Date(updated_at).getTime() : Date.now();

    const rawSpeed = speed || 0;
    const currentSpeedKmH = rawSpeed * 1;
    const currentStatus = status || 'PENDENT';

    pilotsData[pilot_id] = {
      ...point,
      speedKmH: currentSpeedKmH,
      status: currentStatus
    };

    if (visiblePilots[pilot_id] === undefined) {
      visiblePilots[pilot_id] = true;
    }

    if (!pilotTracks[pilot_id]) {
      pilotTracks[pilot_id] = [];
    }

    const now = Date.now();
    pilotTracks[pilot_id] = pilotTracks[pilot_id].filter(p => (now - p.time) <= FIVE_MINUTES_MS);

    const updatePolyline = (currentMarkerLat, currentMarkerLng) => {
      const latLngs = pilotTracks[pilot_id].map(p => [p.lat, p.lng]);
      if (currentMarkerLat !== undefined && currentMarkerLng !== undefined) {
        latLngs.push([currentMarkerLat, currentMarkerLng]);
      }

      if (!polylines[pilot_id]) {
        polylines[pilot_id] = L.polyline(latLngs, {
          color: '#ff3300',
          weight: 4,
          opacity: 0.8,
          smoothFactor: 1
        });
      } else {
        polylines[pilot_id].setLatLngs(latLngs);
      }
    };

    const displayName = pilot_id;
    const iconHtml = createPilotIconHtml(
      displayName,
      currentSpeedKmH,
      currentStatus,
      point
    );

    const customIcon = L.divIcon({
      className: 'custom-pilot-marker',
      html: iconHtml,
      iconSize: [160, 32],
      iconAnchor: [15, 16]
    });

    if (!markers[pilot_id]) {
      pilotTracks[pilot_id].push({ lat: latitude, lng: longitude, time: pointTime });
      markers[pilot_id] = L.marker([latitude, longitude], { icon: customIcon });
      updatePolyline(latitude, longitude);

      if (!isInitialLoad && !initialBoundsFitDone) {
        map.setView([latitude, longitude], 14);
      }
    } else {
      if (isInitialLoad) {
        pilotTracks[pilot_id].push({ lat: latitude, lng: longitude, time: pointTime });
        markers[pilot_id].setLatLng([latitude, longitude]);
        markers[pilot_id].setIcon(customIcon);
        updatePolyline(latitude, longitude);
      } else {
        if (animatingMarkers[pilot_id]) {
          clearInterval(animatingMarkers[pilot_id]);
        }

        const startLatLng = markers[pilot_id].getLatLng();
        pilotTracks[pilot_id].push({ lat: startLatLng.lat, lng: startLatLng.lng, time: pointTime });

        const targetLat = latitude;
        const targetLng = longitude;

        const durationMs = 15000;
        const stepIntervalMs = 500;
        const totalSteps = durationMs / stepIntervalMs;
        let currentStep = 0;

        const deltaLat = (targetLat - startLatLng.lat) / totalSteps;
        const deltaLng = (targetLng - startLatLng.lng) / totalSteps;

        markers[pilot_id].setIcon(customIcon);

        animatingMarkers[pilot_id] = setInterval(() => {
          currentStep++;
          const intermediateLat = startLatLng.lat + (deltaLat * currentStep);
          const intermediateLng = startLatLng.lng + (deltaLng * currentStep);

          markers[pilot_id].setLatLng([intermediateLat, intermediateLng]);
          updatePolyline(intermediateLat, intermediateLng);

          if (currentStep >= totalSteps) {
            clearInterval(animatingMarkers[pilot_id]);
            delete animatingMarkers[pilot_id];
          }
        }, stepIntervalMs);
      }
    }

    markers[pilot_id].bindPopup(`
      <b style="font-size: 1.1em">${displayName}</b><br>
      Perfil: <b>${isVehicle(point) ? 'Transport' : 'Pilot'}</b><br>
      ${isVehicle(point) && Number.isInteger(point.capacity)
        ? `Places: <b>${point.capacity}</b><br>`
        : ''}
      Estat: <b>${currentStatus}</b><br>
      Velocitat: <b>${currentSpeedKmH.toFixed(1)} km/h</b><br>
      Altitud: <b>${altitude ? altitude.toFixed(0) : 0} m</b>
    `);

    updatePilotVisibilityOnMap(pilot_id);
    renderPilotsList();
  }
  
  function fitMapToActivePilots() {
    if (initialBoundsFitDone) return;

    const activeMarkers = [];
    for (const pilot_id in markers) {
      if (visiblePilots[pilot_id] && markers[pilot_id]) {
        activeMarkers.push(markers[pilot_id].getLatLng());
      }
    }

    if (activeMarkers.length > 0) {
      const bounds = L.latLngBounds(activeMarkers);
      map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      initialBoundsFitDone = true;
    }
  }

  function updatePilotVisibilityOnMap(pilot_id) {
    const isVisible = visiblePilots[pilot_id];

    if (isVisible) {
      if (markers[pilot_id] && !map.hasLayer(markers[pilot_id])) {
        map.addLayer(markers[pilot_id]);
      }
      if (polylines[pilot_id] && !map.hasLayer(polylines[pilot_id])) {
        map.addLayer(polylines[pilot_id]);
      }
    } else {
      if (markers[pilot_id] && map.hasLayer(markers[pilot_id])) {
        map.removeLayer(markers[pilot_id]);
      }
      if (polylines[pilot_id] && map.hasLayer(polylines[pilot_id])) {
        map.removeLayer(polylines[pilot_id]);
      }
    }
  }

  function togglePilotVisibility(pilot_id, isChecked) {
    visiblePilots[pilot_id] = isChecked;
    updatePilotVisibilityOnMap(pilot_id);
    updateSelectAllCheckboxState();
  }

  function toggleSelectAll(isChecked) {
    Object.keys(pilotsData).forEach(pilot_id => {
      visiblePilots[pilot_id] = isChecked;
      updatePilotVisibilityOnMap(pilot_id);
    });
    renderPilotsList();
  }

  function toggleSelectAllAction() {
    Object.keys(pilotsData).forEach(pilot_id => {
      visiblePilots[pilot_id] = !visiblePilots[pilot_id];
      updatePilotVisibilityOnMap(pilot_id);
    });
    renderPilotsList();
    updateSelectAllCheckboxState();
  }

  function updateSelectAllCheckboxState() {
    const allIds = Object.keys(pilotsData);
    if (allIds.length === 0) return;
    const allChecked = allIds.every(id => visiblePilots[id]);
    document.getElementById('select-all-checkbox').checked = allChecked;
  }

  function renderPilotsList() {
    const listContainer = document.getElementById('pilots-list');
    const filterText = document.getElementById('search').value.toLowerCase();
    const sortCriterion = document.getElementById('sort-select').value;
    listContainer.innerHTML = '';

    let pilots = [];
    let vehicles = [];

    Object.values(pilotsData).forEach(item => {
      if (isVehicle(item)) {
        vehicles.push(item);
      } else if (item.pilot_id.toLowerCase().includes(filterText)) {
        pilots.push(item);
      }
    });

    const sortFunction = (a, b) => {
      if (sortCriterion === 'STATUS') {
        const priorityA = STATUS_PRIORITY[a.status] || 99;
        const priorityB = STATUS_PRIORITY[b.status] || 99;
        if (priorityA !== priorityB) {
          return priorityA - priorityB;
        }
        return a.pilot_id.localeCompare(b.pilot_id);
      } else if (sortCriterion === 'SPEED') {
        return (b.speedKmH || 0) - (a.speedKmH || 0);
      } else {
        return a.pilot_id.localeCompare(b.pilot_id);
      }
    };

    pilots.sort(sortFunction);
    vehicles.sort(sortFunction);

    if (pilots.length > 0) {
      const header = document.createElement('div');
      header.className = 'section-title';
      header.innerText = `Pilots (${pilots.length})`;
      listContainer.appendChild(header);

      pilots.forEach(pilot => createCard(pilot, listContainer, vehicles));
    }

    if (vehicles.length > 0) {
      const header = document.createElement('div');
      header.className = 'section-title';
      header.innerText = `Logística (${vehicles.length})`;
      listContainer.appendChild(header);

      vehicles.forEach(vehicle => createCard(vehicle, listContainer, vehicles));
    }
  }

  function createCard(pilot, container, vehicles) {
    const isChecked = visiblePilots[pilot.pilot_id] !== false;
    const statusClass = `status-${(pilot.status || 'pendent').toLowerCase()}`;

    const card = document.createElement('div');
    card.className = 'pilot-card';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = isChecked;
    checkbox.addEventListener('change', () => {
      togglePilotVisibility(pilot.pilot_id, checkbox.checked);
    });

    const info = document.createElement('div');
    info.className = 'pilot-info';
    info.addEventListener('click', () => focusPilot(pilot.pilot_id));

    const heading = document.createElement('div');
    heading.className = 'pilot-name';
    const name = document.createElement('span');
    name.textContent = pilot.pilot_id;
    const badge = document.createElement('span');
    badge.className = `status-badge ${statusClass}`;
    badge.textContent = pilot.status || 'PENDENT';
    heading.append(name, badge);

    const stats = document.createElement('div');
    stats.className = 'pilot-stats';
    stats.textContent =
      `⚡ ${pilot.speedKmH ? pilot.speedKmH.toFixed(1) : '0.0'} km/h | 🏔️ ${pilot.altitude ? pilot.altitude.toFixed(0) : 0} m`;
    if (isVehicle(pilot)) {
      stats.textContent += Number.isInteger(pilot.capacity)
        ? ` | Places: ${pilot.capacity}`
        : ' | Places: no indicades';
    }
    info.append(heading, stats);
    card.append(checkbox, info);

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const documentId = pilot._documentId || encodeURIComponent(pilot.pilot_id);

    if (isVehicle(pilot)) {
      const pickupButton = document.createElement('button');
      pickupButton.type = 'button';
      pickupButton.textContent = 'Seleccionar piloto a recoger';
      pickupButton.addEventListener('click', () => {
        selectPilotForVehicle(pilot.pilot_id);
      });

      const messageButton = document.createElement('button');
      messageButton.type = 'button';
      messageButton.textContent = 'Enviar mensaje al vehículo';
      messageButton.addEventListener('click', () => {
        sendOrganizationMessage(pilot.pilot_id, documentId);
      });
      actions.append(pickupButton, messageButton);
    } else {
      const vehicleSelect = document.createElement('select');
      vehicleSelect.setAttribute('aria-label', `Transporte asignado a ${pilot.pilot_id}`);
      const noVehicle = document.createElement('option');
      noVehicle.value = '';
      noVehicle.textContent = 'Sin transporte';
      vehicleSelect.appendChild(noVehicle);

      vehicles.forEach(vehicle => {
        const option = document.createElement('option');
        option.value = vehicle.pilot_id;
        option.textContent = vehicle.pilot_id;
        vehicleSelect.appendChild(option);
      });
      vehicleSelect.value = pilot.assignedDriverId || '';

      const assignButton = document.createElement('button');
      assignButton.type = 'button';
      assignButton.textContent = 'Asignar';
      assignButton.disabled = vehicles.length === 0;
      assignButton.addEventListener('click', () => {
        assignPilotToVehicle(
          documentId,
          vehicleSelect.value
        );
      });

      const messageButton = document.createElement('button');
      messageButton.type = 'button';
      messageButton.textContent = 'Enviar mensaje';
      messageButton.addEventListener('click', () => {
        sendOrganizationMessage(pilot.pilot_id, documentId);
      });

      actions.append(vehicleSelect, assignButton, messageButton);
    }

    card.appendChild(actions);
    container.appendChild(card);
  }

  async function assignPilotToVehicle(
    documentId,
    vehicleId,
    instruction = ''
  ) {
    if (!vehicleId) {
      alert('Selecciona un vehículo antes de asignar el piloto.');
      return false;
    }

    try {
      const assignment = {
        assignedDriverId: vehicleId,
        driverStatus: 'assigned'
      };
      if (instruction) {
        assignment.organizationMessage = instruction;
        assignment.organizationMessageId =
          `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }
      await db.collection('pilots_locations').doc(documentId).set(
        assignment,
        { merge: true }
      );
      alert(
        instruction
          ? `Piloto asignado a ${vehicleId} con instrucciones.`
          : `Piloto asignado a ${vehicleId}.`
      );
      return true;
    } catch (error) {
      console.error('Error asignando transporte:', error);
      alert(`No se ha podido asignar el vehículo: ${error.message}`);
      return false;
    }
  }

  function selectPilotForVehicle(vehicleId) {
    const pilots = Object.values(pilotsData)
      .filter(pilot => !isVehicle(pilot))
      .sort((a, b) => a.pilot_id.localeCompare(b.pilot_id));

    if (pilots.length === 0) {
      alert('No hay pilotos disponibles para asignar.');
      return;
    }

    const dialog = document.createElement('dialog');
    dialog.className = 'pickup-dialog';
    const form = document.createElement('form');
    const heading = document.createElement('h2');
    heading.textContent = `Seleccionar piloto para ${vehicleId}`;
    const label = document.createElement('label');
    label.textContent = 'Piloto a recoger';
    const select = document.createElement('select');
    select.required = true;
    select.setAttribute('aria-label', 'Piloto a recoger');

    const instructionLabel = document.createElement('label');
    instructionLabel.textContent = 'Instrucciones para el transporte (opcional)';
    instructionLabel.style.marginTop = '14px';
    const instructionInput = document.createElement('textarea');
    instructionInput.maxLength = 500;
    instructionInput.placeholder = 'Ej.: Vuelve a GOL';
    instructionInput.setAttribute(
      'aria-label',
      'Instrucciones para el transporte'
    );
    instructionLabel.appendChild(instructionInput);

    pilots.forEach(pilot => {
      const option = document.createElement('option');
      option.value = pilot._documentId;
      option.textContent = pilot.pilot_id;
      select.appendChild(option);
    });

    const actions = document.createElement('div');
    actions.className = 'pickup-dialog-actions';
    const cancelButton = document.createElement('button');
    cancelButton.type = 'button';
    cancelButton.textContent = 'Cancelar';
    cancelButton.addEventListener('click', () => dialog.close());
    const assignButton = document.createElement('button');
    assignButton.type = 'submit';
    assignButton.textContent = 'Asignar recogida';
    actions.append(cancelButton, assignButton);
    label.appendChild(select);
    form.append(heading, label, instructionLabel, actions);
    dialog.appendChild(form);
    document.body.appendChild(dialog);

    dialog.addEventListener('close', () => dialog.remove(), { once: true });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      assignButton.disabled = true;
      const success = await assignPilotToVehicle(
        select.value,
        vehicleId,
        instructionInput.value.trim()
      );
      if (success) {
        dialog.close();
      } else {
        assignButton.disabled = false;
      }
    });
    dialog.showModal();
  }

  async function sendOrganizationMessage(pilotId, documentId) {
    const text = window.prompt(`Mensaje para ${pilotId}:`);
    if (text === null || !text.trim()) return;

    try {
      await db.collection('pilots_locations').doc(documentId).set({
        organizationMessage: text.trim(),
        organizationMessageId: `${Date.now()}-${Math.random().toString(36).slice(2)}`
      }, { merge: true });
      alert(`Mensaje enviado a ${pilotId}.`);
    } catch (error) {
      console.error('Error enviando mensaje:', error);
      alert(`No se ha podido enviar el mensaje: ${error.message}`);
    }
  }

  function focusPilot(pilot_id) {
    const pilot = pilotsData[pilot_id];
    if (pilot && markers[pilot_id]) {
      if (!visiblePilots[pilot_id]) {
        togglePilotVisibility(pilot_id, true);
        renderPilotsList();
      }
      map.flyTo([pilot.latitude, pilot.longitude], 16);
      markers[pilot_id].openPopup();
    }
  }

  function filterPilots() {
    renderPilotsList();
  }

  // Escuchar datos en tiempo real con Firestore con captura de errores
  let isInitialSnapshot = true;
  db.collection('pilots_locations').onSnapshot((snapshot) => {
    snapshot.docChanges().forEach((change) => {
      if (change.type === "added" || change.type === "modified") {
        const data = change.doc.data();
        processNewPoint({
          ...data,
          pilot_id: data.pilot_id || change.doc.id,
          _documentId: change.doc.id
        }, isInitialSnapshot);
      } else if (change.type === "removed") {
        const pilot = pilotsData[change.doc.data().pilot_id || change.doc.id];
        if (pilot) {
          const pilotId = pilot.pilot_id;
          if (markers[pilotId] && map.hasLayer(markers[pilotId])) {
            map.removeLayer(markers[pilotId]);
          }
          if (polylines[pilotId] && map.hasLayer(polylines[pilotId])) {
            map.removeLayer(polylines[pilotId]);
          }
          if (animatingMarkers[pilotId]) {
            clearInterval(animatingMarkers[pilotId]);
            delete animatingMarkers[pilotId];
          }
          delete markers[pilotId];
          delete polylines[pilotId];
          delete pilotTracks[pilotId];
          delete visiblePilots[pilotId];
          delete pilotsData[pilotId];
        }
      }
    });
    const currentPendingAssignmentIds = new Set(
      Object.values(pilotsData)
        .filter(
          pilot => pilot.assignedDriverId && pilot.driverStatus === 'assigned'
        )
        .map(pilot => pilot._documentId || pilot.pilot_id)
    );
    const hasNewPendingAssignment = [...currentPendingAssignmentIds]
      .some(id => !previousPendingAssignmentIds.has(id));
    if (
      (!receivedInitialAssignments && currentPendingAssignmentIds.size > 0) ||
      (receivedInitialAssignments && hasNewPendingAssignment)
    ) {
      toggleAssignedBoard(true);
    }
    previousPendingAssignmentIds = currentPendingAssignmentIds;
    receivedInitialAssignments = true;
    renderAssignedPickups();
    if (isInitialSnapshot) {
      fitMapToActivePilots();
      isInitialSnapshot = false;
    }
  }, (error) => {
    console.error("Error al escuchar en Firestore:", error);
    if (error.code === 'permission-denied') {
      alert("Error de permisos: Las Reglas de Seguridad de Firestore están bloqueando la lectura.");
    }
  });
</script>
